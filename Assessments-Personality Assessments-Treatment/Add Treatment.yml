      body:
        type: json
        data: '"{\r\n  \"user_id\": 5,\r\n  \"category_id\": 81,\r\n  \"type\": \"increase\"\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
