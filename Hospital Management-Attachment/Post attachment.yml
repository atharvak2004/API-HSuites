info:
  name: Post attachment
  type: http
  seq: 1
  tags:
    - Hospital Management/Attachment

http:
  method: POST
  url: "{{baseUrl}}hospital/attachments/"
  headers:
    - name: Hospital-Id
      value: HID00002
  body:
    type: multipart-form
    data:
      - name: patient
        type: text
        value: "26"
      - name: attachment_name
        type: text
        value: X-ray Report
      - name: description
        type: text
        value: X-ray report of chest
      - name: file
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/attachments/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: multipart-form
        data:
          - name: patient
            type: text
            value: "26"
          - name: attachment_name
            type: text
            value: X-ray Report
          - name: description
            type: text
            value: X-ray report of chest
          - name: file
            type: file
            value: []
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/attachments/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: multipart-form
        data:
          - name: patient
            type: text
            value: "26"
          - name: attachment_name
            type: text
            value: X-ray Report
          - name: description
            type: text
            value: X-ray report of chest
          - name: file
            type: file
            value: []
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
