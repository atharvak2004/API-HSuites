info:
  name: Post prescription
  type: http
  seq: 1
  tags:
    - Hospital Management/Prescription

http:
  method: POST
  url: "{{baseUrl}}hospital/prescription/"
  headers:
    - name: Hospital-Id
      value: HID00001
  body:
    type: multipart-form
    data:
      - name: patient
        type: text
        value: "1"
      - name: user
        type: text
        value: "2"
      - name: notes
        type: text
        value: test
      - name: image
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

