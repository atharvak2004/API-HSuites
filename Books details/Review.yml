    description: Success
    request:
      url: "{{baseUrl}}books/review/"
      method: POST
      body:
        type: json
        data: '"{\r\n  \"description_id\": 1,\r\n  \"user_id\": 4,\r\n  \"approved\": true,\r\n  \"updated\": true\r\n}\r\n"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
