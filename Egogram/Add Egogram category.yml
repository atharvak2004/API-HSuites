info:
  name: Add Egogram category
  type: http
  seq: 4
  tags:
    - Egogram

http:
  method: POST
  url: "{{baseUrl}}egogram/categories/"
  body:
    type: json
    data: '"[\r\n    {\r\n        \"category\": \"Critical Parent\",\r\n        \"category_description\": \"Reflects values, rules, and judgments learned from authority figures.\"\r\n    },\r\n    {\r\n        \"category\": \"Nurturing Parent\",\r\n        \"category_description\": \"Represents caring, empathy, and protective instincts towards others.\"\r\n    },\r\n    {\r\n        \"category\": \"Adult\",\r\n        \"category_description\": \"Indicates logical thinking, decision-making, and realistic problem-solving.\"\r\n    },\r\n    {\r\n        \"category\": \"Free Child\",\r\n        \"category_description\": \"Represents spontaneity, creativity, and uninhibited expression.\"\r\n    },\r\n    {\r\n        \"category\": \"adapted Child\",\r\n        \"category_description\": \"Represents spontaneity, creativity, and uninhibited expression.\"\r\n    }\r\n]\r\n"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}egogram/categories/"
      method: POST
      body:
        type: json
        data: '"[\r\n    {\r\n        \"category\": \"Critical Parent\",\r\n        \"category_description\": \"Reflects values, rules, and judgments learned from authority figures.\"\r\n    },\r\n    {\r\n        \"category\": \"Nurturing Parent\",\r\n        \"category_description\": \"Represents caring, empathy, and protective instincts towards others.\"\r\n    },\r\n    {\r\n        \"category\": \"Adult\",\r\n        \"category_description\": \"Indicates logical thinking, decision-making, and realistic problem-solving.\"\r\n    },\r\n    {\r\n        \"category\": \"Free Child\",\r\n        \"category_description\": \"Represents spontaneity, creativity, and uninhibited expression.\"\r\n    },\r\n    {\r\n        \"category\": \"adapted Child\",\r\n        \"category_description\": \"Represents spontaneity, creativity, and uninhibited expression.\"\r\n    }\r\n]\r\n"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}egogram/categories/"
      method: POST
      body:
        type: json
        data: '"[\r\n    {\r\n        \"category\": \"Critical Parent\",\r\n        \"category_description\": \"Reflects values, rules, and judgments learned from authority figures.\"\r\n    },\r\n    {\r\n        \"category\": \"Nurturing Parent\",\r\n        \"category_description\": \"Represents caring, empathy, and protective instincts towards others.\"\r\n    },\r\n    {\r\n        \"category\": \"Adult\",\r\n        \"category_description\": \"Indicates logical thinking, decision-making, and realistic problem-solving.\"\r\n    },\r\n    {\r\n        \"category\": \"Free Child\",\r\n        \"category_description\": \"Represents spontaneity, creativity, and uninhibited expression.\"\r\n    },\r\n    {\r\n        \"category\": \"adapted Child\",\r\n        \"category_description\": \"Represents spontaneity, creativity, and uninhibited expression.\"\r\n    }\r\n]\r\n"'
    response:
      status: 404
