info:
  name: Get all OPD
  type: http
  seq: 4
  tags:
    - Hospital Management/OPD

http:
  method: GET
  url: "{{baseUrl}}hospital/opds/"
  headers:
    - name: Hospital-Id
      value: HID00001
  params:
    - name: search
      value: neh
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/opds/"
      method: GET
      headers:
        - name: Hospital-Id
          value: HID00001
      params:
        - name: search
          value: neh
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/opds/"
      method: GET
      headers:
        - name: Hospital-Id
          value: HID00001
      params:
        - name: search
          value: neh
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
