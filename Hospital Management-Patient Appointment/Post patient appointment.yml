info:
  name: Post patient appointment
  type: http
  seq: 1
  tags:
    - Hospital Management/Patient Appointment

http:
  method: POST
  url: "{{baseUrl}}hospital/patient/appointment/"
  headers:
    - name: Hospital-Id
      value: HID00002
  body:
    type: json
    data: '"{\r\n  \"department\": \"Neurology\",\r\n  \"preferred_doctor\": 16,\r\n  \"reason\": \"test Chest pain and fatigue\",\r\n  \"preferred_date_and_time\": \"2025-08-04T11:00:00Z\",\r\n  \"patient_status\": \"available\",\r\n  \"patient_id\": 57\r\n}\r\n"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

