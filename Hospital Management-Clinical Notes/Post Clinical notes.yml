info:
  name: Post Clinical notes
  type: http
  seq: 1
  tags:
    - Hospital Management/Clinical Notes

http:
  method: POST
  url: "{{baseUrl}}hospital/clinical-notes/"
  headers:
    - name: Hospital-Id
      value: HID00002
  body:
    type: json
    data: '"{\r\n  \"pain\": \"Headache\",\r\n  \"patient\": 37,\r\n  \"pain_start_date\": \"2025-06-01\",\r\n  \"pain_severity\": \"moderate\",\r\n  \"observation\": \"Patient appears pale and weak.\",\r\n  \"diagnosis\": \"Migraine\",\r\n  \"evidence\": \"CT scan reports support migraine symptoms.\",\r\n  \"treatment_plan\": \"Prescribe rest, hydration, and medication.\",\r\n  \"advice\": \"Avoid bright light and loud noise.\",\r\n  \"remark\": \"Follow-up after 7 days.\",\r\n  \"next_followup_date\": \"2025-06-25\",\r\n  \"added_by\":16\r\n}\r\n"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

