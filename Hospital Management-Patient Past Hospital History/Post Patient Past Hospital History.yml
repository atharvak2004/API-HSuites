info:
  name: Post Patient Past Hospital History
  type: http
  seq: 1
  tags:
    - Hospital Management/Patient Past Hospital History

http:
  method: POST
  url: "{{baseUrl}}hospital/past-history/"
  headers:
    - name: Hospital-Id
      value: HID00001
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/past-history/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00001
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/past-history/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00001
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
