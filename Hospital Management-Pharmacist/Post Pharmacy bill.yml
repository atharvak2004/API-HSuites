info:
  name: Post Pharmacy bill
  type: http
  seq: 3
  tags:
    - Hospital Management/Pharmacist

http:
  method: POST
  url: "{{baseUrl}}hospital/pharmacy-bill/"
  headers:
    - name: Hospital-Id
      value: HID00002
  body:
    type: json
    data: '"{\r\n  \"patient_id\": 49,\r\n  \"user_id\": 13,\r\n  \"prescription_id\": 110,\r\n  \"date_issued\": \"2025-07-17\",\r\n  \"medical_items\": [\r\n    {\r\n      \"name\": \"wf\",\r\n      \"dosage\": \"60mg\",\r\n      \"amount\": 56,\r\n      \"duration\": \"4days\",\r\n      \"quantity\": 16\r\n    }\r\n  ]\r\n}\r\n"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
