info:
  name: code automation
  type: http
  seq: 1
  tags:
    - Coding Automation

http:
  method: POST
  url: "{{baseUrl}}coding/process-medical-document/"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}coding/process-medical-document/"
      method: POST
      body:
        type: multipart-form
        data:
          - name: file
            type: file
            value: []
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}coding/process-medical-document/"
      method: POST
      body:
        type: multipart-form
        data:
          - name: file
            type: file
            value: []
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
