info:
  name: Post finding
  type: http
  seq: 1
  tags:
    - Hospital Management/Finding

http:
  method: POST
  url: "{{baseUrl}}hospital/finding/"
  headers:
    - name: Hospital-Id
      value: HID00002
  body:
    type: json
    data: '"{\r\n    \"patient\": 37,\r\n    // \"date\": \"2025-06-14\",\r\n    \"temperature\": 98.6,\r\n    \"pulse\": 75,\r\n    \"blood_pressure\": \"120/80\",\r\n    \"weight\": 65.0,\r\n    \"height\": 170.0,\r\n    \"cns\": \"Normal\",\r\n    \"rs\": \"Clear\",\r\n    \"pa\": \"Soft\",\r\n    \"wbc\": \"6000\",\r\n    \"rbc\": \"4.5 million\",\r\n    \"note\":\"testing finding\"\r\n}\r\n"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/finding/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n    \"patient\": 37,\r\n    // \"date\": \"2025-06-14\",\r\n    \"temperature\": 98.6,\r\n    \"pulse\": 75,\r\n    \"blood_pressure\": \"120/80\",\r\n    \"weight\": 65.0,\r\n    \"height\": 170.0,\r\n    \"cns\": \"Normal\",\r\n    \"rs\": \"Clear\",\r\n    \"pa\": \"Soft\",\r\n    \"wbc\": \"6000\",\r\n    \"rbc\": \"4.5 million\",\r\n    \"note\":\"testing finding\"\r\n}\r\n"'
