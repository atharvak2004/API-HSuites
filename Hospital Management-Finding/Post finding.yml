info:
  name: Post finding
  type: http
  seq: 1
  tags:
    - Hospital Management/Finding

http:
  method: POST
  url: "{{baseUrl}}hospital/finding/"
  headers:
    - name: Hospital-Id
      value: HID00007
  body:
    type: json
    data: |-
      {
        "patient": 1,
        "recorded_at": "2026-09-12T10:30:00Z",
        "temperature": 37.2,
        "pulse": 78,
        "blood_pressure_systolic": 120,
        "blood_pressure_diastolic": 80,
        "respiratory_rate": 16,
        "spo2": 98.5,
        "weight": 68.5,
        "height": 172,
        "note": "Patient stable, no complaints."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

