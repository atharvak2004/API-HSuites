          value: HID00001
      body:
        type: json
        data: '"{\r\n  \"medicine_name\": \"paractamol\",\r\n  \"medicine_type\": \"tablet\",\r\n  \"medicine_unit\": \"mg\",\r\n  \"manufacturer\": \"Cipla\",\r\n  \"is_narcotic\": false,\r\n  \"description\": \"Used for fever and mild pain.\"\r\n}\r\n"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
