info:
  name: Patient Verify OTP
  type: http
  seq: 2
  tags:
    - Hospital Management/Patient Registration

http:
  method: POST
  url: "{{baseUrl}}hospital/patient/verify-otp/"
  headers:
    - name: Hospital-Id
      value: HID00002
  body:
    type: json
    data: '"{\r\n  \"patient_id\": 57,\r\n  \"email_otp\": 918703 \r\n}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/patient/verify-otp/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n  \"patient_id\": 57,\r\n  \"email_otp\": 918703 \r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/patient/verify-otp/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n  \"patient_id\": 57,\r\n  \"email_otp\": 918703 \r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
