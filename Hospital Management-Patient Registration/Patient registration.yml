info:
  name: Patient registration
  type: http
  seq: 1
  tags:
    - Hospital Management/Patient Registration

http:
  method: POST
  url: "{{baseUrl}}hospital/patient/register/"
  body:
    type: json
    data: '"{\r\n  \"full_name\": \"Rahul Sharma\",\r\n  \"email\": \"004iipt@gmail.com\",\r\n  \"password\": \"Secure@123\",\r\n  \"gender\": \"Male\",\r\n  \"dob\": \"1995-10-20\",\r\n  \"contact_number\": \"9876543210\",\r\n  \"address\": \"Pune, Maharashtra\",\r\n  \"hospital_id\": \"HID00001\"\r\n}"'
