info:
  name: Patient Login
  type: http
  seq: 3
  tags:
    - Hospital Management/Patient Registration

http:
  method: POST
  url: "{{baseUrl}}hospital/patient/login/"
  headers:
    - name: Hospital-Id
      value: HID00002
  body:
    type: json
    data: '"{\r\n  \"email\": \"004iipt@gmail.com\",\r\n  \"password\": \"Password\"\r\n}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/patient/login/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n  \"email\": \"004iipt@gmail.com\",\r\n  \"password\": \"Password\"\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/patient/login/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n  \"email\": \"004iipt@gmail.com\",\r\n  \"password\": \"Password\"\r\n}"'
    response:
