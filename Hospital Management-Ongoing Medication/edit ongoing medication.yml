    description: Success
    request:
      url: "{{baseUrl}}hospital/ongoing-medication/"
      method: PUT
      body:
        type: json
        data: '"{\r\n    \"id\": 1,\r\n    \"medicine_name\": \"Azithromycin\",\r\n    \"type\": \"capsule\",\r\n    \"dosage_amount\": 500,\r\n    \"dosage_unit\": \"mg\",\r\n    \"frequency\": \"twice_daily\",\r\n    \"doctor\": 16,\r\n    \"patient\": 26,\r\n    \"diseases_name\": 7,\r\n    \"notes\": \"Take after meals\"\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
