      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n    \"medicine_name\": \"Azithromysdfcin\",\r\n    \"type\": \"tablet\",\r\n    \"dosage_amount\": 300,\r\n    \"dosage_unit\": \"mg\",\r\n    \"frequency\": \"once_daily\",\r\n    \"doctor\": 16,\r\n    \"patient\": 26,\r\n    \"diseases_name\": 7,\r\n    \"notes\": \"Take on an empty stomach\"\r\n}\r\n"'
