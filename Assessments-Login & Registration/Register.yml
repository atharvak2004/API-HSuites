info:
  name: Register
  type: http
  seq: 1
  tags:
    - Assessments/Login & Registration

http:
  method: POST
  url: "{{baseUrl}}assessments/register-medical/"
  body:
    type: json
    data: '"{\r\n    \"first_name\": \"Priyanshu\",\r\n    \"last_name\": \"Sharma\",\r\n    \"email\": \"test@gmail.com\",\r\n    \"password\": \"password\",\r\n    \"role\": \"admin\"\r\n}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}assessments/register-medical/"
      method: POST
      body:
        type: json
        data: '"{\r\n    \"first_name\": \"Priyanshu\",\r\n    \"last_name\": \"Sharma\",\r\n    \"email\": \"test@gmail.com\",\r\n    \"password\": \"password\",\r\n    \"role\": \"admin\"\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}assessments/register-medical/"
      method: POST
      body:
        type: json
        data: '"{\r\n    \"first_name\": \"Priyanshu\",\r\n    \"last_name\": \"Sharma\",\r\n    \"email\": \"test@gmail.com\",\r\n    \"password\": \"password\",\r\n    \"role\": \"admin\"\r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
