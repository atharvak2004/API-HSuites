info:
  name: Add User
  type: http
  seq: 4
  tags:
    - Assessments/Login & Registration

http:
  method: POST
  url: "{{baseUrl}}assessments/add-user/"
  body:
    type: json
    data: '"{\r\n    \"first_name\": \"P\",\r\n    \"last_name\": \"p\",\r\n    \"username\": \"p\",\r\n    \"email\": \"p@gmail.com\",\r\n    \"password\": \"password\",\r\n    \"role\": \"user\"\r\n}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}assessments/add-user/"
      method: POST
      body:
        type: json
        data: '"{\r\n    \"first_name\": \"P\",\r\n    \"last_name\": \"p\",\r\n    \"username\": \"p\",\r\n    \"email\": \"p@gmail.com\",\r\n    \"password\": \"password\",\r\n    \"role\": \"user\"\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}assessments/add-user/"
      method: POST
      body:
        type: json
        data: '"{\r\n    \"first_name\": \"P\",\r\n    \"last_name\": \"p\",\r\n    \"username\": \"p\",\r\n    \"email\": \"p@gmail.com\",\r\n    \"password\": \"password\",\r\n    \"role\": \"user\"\r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
