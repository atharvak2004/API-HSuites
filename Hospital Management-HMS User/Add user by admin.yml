info:
  name: Add user by admin
  type: http
  seq: 3
  tags:
    - Hospital Management/HMS User

http:
  method: POST
  url: "{{baseUrl}}hospital/hmsuser/admin/add-user/"
  headers:
    - name: Hospital-Id
      value: HID00002
  body:
    type: json
    data: '"{\r\n  \"name\": \"Devi1 Patil\", \r\n  \"designation\": \"doctor\", \r\n  \"email\": \"devi1@gmail.com\", \r\n  \"password\": \"password\"\r\n  // \"pharmacist_type\": \"in\"\r\n}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/hmsuser/admin/add-user/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n  \"name\": \"Devi1 Patil\", \r\n  \"designation\": \"doctor\", \r\n  \"email\": \"devi1@gmail.com\", \r\n  \"password\": \"password\"\r\n  // \"pharmacist_type\": \"in\"\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/hmsuser/admin/add-user/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n  \"name\": \"Devi1 Patil\", \r\n  \"designation\": \"doctor\", \r\n  \"email\": \"devi1@gmail.com\", \r\n  \"password\": \"password\"\r\n  // \"pharmacist_type\": \"in\"\r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
