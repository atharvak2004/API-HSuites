info:
  name: HMS User registration
  type: http
  seq: 1
  tags:
    - Hospital Management/HMS User

http:
  method: POST
  url: "{{baseUrl}}hospital/hmsuser/register/"
  body:
    type: json
    data: '"{\r\n    \"name\": \"Dr. Meera Sharma reg test\",\r\n    \"designation\": \"doctor\",\r\n    \"email\": \"test@example.com\",\r\n    \"password\": \"password\"\r\n}\r\n// needs to be rechecked"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/hmsuser/register/"
      method: POST
      body:
        type: json
        data: '"{\r\n    \"name\": \"Dr. Meera Sharma reg test\",\r\n    \"designation\": \"doctor\",\r\n    \"email\": \"test@example.com\",\r\n    \"password\": \"password\"\r\n}\r\n// needs to be rechecked"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/hmsuser/register/"
      method: POST
      body:
        type: json
        data: '"{\r\n    \"name\": \"Dr. Meera Sharma reg test\",\r\n    \"designation\": \"doctor\",\r\n    \"email\": \"test@example.com\",\r\n    \"password\": \"password\"\r\n}\r\n// needs to be rechecked"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
