info:
  name: Get Doctor Timetable
  type: http
  seq: 2
  tags:
    - Hospital Management/Doctor Timetable

http:
  method: GET
  url: "{{baseUrl}}hospital/doctor-timetable/16/"
  headers:
    - name: Hospital-Id
      value: HID00002
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/doctor-timetable/16/"
      method: GET
      headers:
        - name: Hospital-Id
          value: HID00002
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/doctor-timetable/16/"
      method: GET
      headers:
        - name: Hospital-Id
          value: HID00002
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
