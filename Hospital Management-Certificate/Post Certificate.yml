info:
  name: Post Certificate
  type: http
  seq: 1
  tags:
    - Hospital Management/Certificate

http:
  method: POST
  url: "{{baseUrl}}hospital/certificates/"
  headers:
    - name: Hospital-Id
      value: HID00002
  body:
    type: json
    data: '"{\r\n  \"patient\": 26,\r\n  \"added_by\": 16,\r\n  \"description\": \"This is to certify that the patient is advised 5 days of rest due to viral fever.\",\r\n  \"remark\": \"Needs follow-up after recovery.\"\r\n}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/certificates/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n  \"patient\": 26,\r\n  \"added_by\": 16,\r\n  \"description\": \"This is to certify that the patient is advised 5 days of rest due to viral fever.\",\r\n  \"remark\": \"Needs follow-up after recovery.\"\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/certificates/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n  \"patient\": 26,\r\n  \"added_by\": 16,\r\n  \"description\": \"This is to certify that the patient is advised 5 days of rest due to viral fever.\",\r\n  \"remark\": \"Needs follow-up after recovery.\"\r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
