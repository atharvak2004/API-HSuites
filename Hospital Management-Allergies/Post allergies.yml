info:
  name: Post allergies
  type: http
  seq: 1
  tags:
    - Hospital Management/Allergies

http:
  method: POST
  url: "{{baseUrl}}hospital/allergies/"
  headers:
    - name: Hospital-Id
      value: HID00001
  body:
    type: json
    data: '"{\r\n  \"name\": \"Peanuts\",\r\n  \"description\": \"Severe afghllergic reaction\",\r\n  \"patient_id\": 2\r\n}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/allergies/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00001
      body:
        type: json
        data: '"{\r\n  \"name\": \"Peanuts\",\r\n  \"description\": \"Severe afghllergic reaction\",\r\n  \"patient_id\": 2\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/allergies/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00001
      body:
        type: json
        data: '"{\r\n  \"name\": \"Peanuts\",\r\n  \"description\": \"Severe afghllergic reaction\",\r\n  \"patient_id\": 2\r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
