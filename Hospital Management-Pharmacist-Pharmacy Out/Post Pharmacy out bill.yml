info:
  name: Post Pharmacy out bill
  type: http
  seq: 1
  tags:
    - Hospital Management/Pharmacist/Pharmacy Out

http:
  method: POST
  url: "{{baseUrl}}hospital/pharmacy/out-bill/"
  headers:
    - name: Hospital-Id
      value: HID00002
  body:
    type: json
    data: '"{\r\n    \"patient_name\": \"Gayatri\",\r\n    \"note\": \"Urgent fever medicines2\",\r\n    \"medicine_items\": [\r\n        {\r\n            \"name\": \"wf\",\r\n            \"dosage\": \"60mg\",\r\n            \"duration\": \"4days\",\r\n            \"quantity\": 5\r\n        }\r\n    ]\r\n}\r\n"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/pharmacy/out-bill/"
      method: POST
      headers:
        - name: Hospital-Id
          value: HID00002
      body:
        type: json
        data: '"{\r\n    \"patient_name\": \"Gayatri\",\r\n    \"note\": \"Urgent fever medicines2\",\r\n    \"medicine_items\": [\r\n        {\r\n            \"name\": \"wf\",\r\n            \"dosage\": \"60mg\",\r\n            \"duration\": \"4days\",\r\n            \"quantity\": 5\r\n        }\r\n    ]\r\n}\r\n"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
          	"message": "Pharmacy out-patient bill created successfully",
          	"bill": {
          		"id": 3,
