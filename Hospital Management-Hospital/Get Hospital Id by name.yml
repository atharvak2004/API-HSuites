info:
  name: Get Hospital Id by name
  type: http
  seq: 3
  tags:
    - Hospital Management/Hospital

http:
  method: POST
  url: "{{baseUrl}}hospital/get-hospital-id"
  body:
    type: json
    data: '"{\r\n    \"hospital_name\": \"Sukhakarta Hospital\"\r\n}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}hospital/get-hospital-id"
      method: POST
      body:
        type: json
        data: '"{\r\n    \"hospital_name\": \"Sukhakarta Hospital\"\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}hospital/get-hospital-id"
      method: POST
      body:
        type: json
        data: '"{\r\n    \"hospital_name\": \"Sukhakarta Hospital\"\r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
