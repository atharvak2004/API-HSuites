http:
  method: POST
  url: "{{baseUrl}}assessments/question_add"
  body:
    type: json
    data: "\"[\\r\\n    {\\r\\n        \\\"question\\\": \\\"How do you approach problem-solving?\\\",\\r\\n        \\\"logical\\\": \\\"Follow a clear process\\\",\\r\\n        \\\"analytical\\\": \\\"Identify the root cause\\\",\\r\\n        \\\"strategic\\\": \\\"Think about long-term impact\\\",\\r\\n        \\\"thinking\\\": \\\"Try multiple solutions\\\"\\r\\n    },\\r\\n    {\\r\\n        \\\"question\\\": \\\"What is your preferred work environment?\\\",\\r\\n        \\\"logical\\\": \\\"Structured and organized\\\",\\r\\n        \\\"analytical\\\": \\\"Data-driven and detailed\\\",\\r\\n        \\\"strategic\\\": \\\"Goal-oriented and ambitious\\\",\\r\\n        \\\"thinking\\\": \\\"Flexible and dynamic\\\"\\r\\n    },\\r\\n    {\\r\\n        \\\"question\\\": \\\"How do you handle new information?\\\",\\r\\n        \\\"logical\\\": \\\"Categorize and store it\\\",\\r\\n        \\\"analytical\\\": \\\"Break it down into key points\\\",\\r\\n        \\\"strategic\\\": \\\"Think about how it can be applied\\\",\\r\\n        \\\"thinking\\\": \\\"Experiment with it\\\"\\r\\n    },\\r\\n    {\\r\\n        \\\"question\\\": \\\"How do you stay motivated?\\\",\\r\\n        \\\"logical\\\": \\\"Achieving small milestones\\\",\\r\\n        \\\"analytical\\\": \\\"Understanding the bigger picture\\\",\\r\\n        \\\"strategic\\\": \\\"Working towards future success\\\",\\r\\n        \\\"thinking\\\": \\\"Trying new approaches\\\"\\r\\n    },\\r\\n    {\\r\\n        \\\"question\\\": \\\"What is your approach to teamwork?\\\",\\r\\n        \\\"logical\\\": \\\"Ensure clear communication\\\",\\r\\n        \\\"analytical\\\": \\\"Analyze everyone's strengths\\\",\\r\\n        \\\"strategic\\\": \\\"Align with common objectives\\\",\\r\\n        \\\"thinking\\\": \\\"Encourage creative ideas\\\"\\r\\n    },\\r\\n    {\\r\\n        \\\"question\\\": \\\"How do you handle setbacks?\\\",\\r\\n        \\\"logical\\\": \\\"Analyze the mistake and correct it\\\",\\r\\n        \\\"analytical\\\": \\\"Find the cause and learn from it\\\",\\r\\n        \\\"strategic\\\": \\\"Adjust my approach for the future\\\",\\r\\n        \\\"thinking\\\": \\\"Stay optimistic and move forward\\\"\\r\\n    },\\r\\n    {\\r\\n        \\\"question\\\": \\\"What is your approach to leadership?\\\",\\r\\n        \\\"logical\\\": \\\"Ensure structured workflows\\\",\\r\\n        \\\"analytical\\\": \\\"Make data-driven decisions\\\",\\r\\n        \\\"strategic\\\": \\\"Focus on long-term goals\\\",\\r\\n        \\\"thinking\\\": \\\"Encourage creativity and flexibility\\\"\\r\\n    },\\r\\n    {\\r\\n        \\\"question\\\": \\\"How do you measure success?\\\",\\r\\n        \\\"logical\\\": \\\"By achieving set goals\\\",\\r\\n        \\\"analytical\\\": \\\"By gaining insights and knowledge\\\",\\r\\n        \\\"strategic\\\": \\\"By making a lasting impact\\\",\\r\\n        \\\"thinking\\\": \\\"By feeling satisfied with my work\\\"\\r\\n    },\\r\\n    {\\r\\n        \\\"question\\\": \\\"How do you make important decisions?\\\",\\r\\n        \\\"logical\\\": \\\"By relying on proven methods\\\",\\r\\n        \\\"analytical\\\": \\\"By carefully evaluating all options\\\",\\r\\n        \\\"strategic\\\": \\\"By considering long-term consequences\\\",\\r\\n        \\\"thinking\\\": \\\"By trusting my instincts\\\"\\r\\n    },\\r\\n    {\\r\\n        \\\"question\\\": \\\"What is your approach to continuous learning?\\\",\\r\\n        \\\"logical\\\": \\\"Follow a structured plan\\\",\\r\\n        \\\"analytical\\\": \\\"Research and analyze deeply\\\",\\r\\n        \\\"strategic\\\": \\\"Apply knowledge to real-world scenarios\\\",\\r\\n        \\\"thinking\\\": \\\"Learn by experimenting\\\"\\r\\n    }\\r\\n]\\r\\n\""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

